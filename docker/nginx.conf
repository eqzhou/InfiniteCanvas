worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 64m;
  # Slow uplinks can legitimately need more than nginx's 60 second default to
  # stream a large canvas image. Keep this above the browser upload timeout.
  client_body_timeout 250s;
  gzip on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json image/svg+xml text/css;

  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
      proxy_pass http://127.0.0.1:8790/api/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization "Bearer ${OPENBOARD_TOKEN}";
      access_log off;
    }

    location /api/ {
      proxy_pass http://127.0.0.1:8790;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Authorization "Bearer ${OPENBOARD_TOKEN}";
      proxy_request_buffering off;
      proxy_buffering off;
		proxy_send_timeout 250s;
		proxy_read_timeout 250s;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
    }

    location / {
      try_files $uri $uri/ /index.html;
      expires -1;
    }
  }
}
