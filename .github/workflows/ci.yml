name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - name: Enforce web coverage at 80%
        run: bun run test:coverage
      - run: bun run benchmark:indexes:assert
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBOARD_TEST_DATABASE_URL: postgres://openboard_go:openboard_go@127.0.0.1:5432/openboard_go?sslmode=disable
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openboard_go
          POSTGRES_USER: openboard_go
          POSTGRES_PASSWORD: openboard_go
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openboard_go -d openboard_go"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o ./bin/openboard-server ./cmd/server
      - run: go build -trimpath -o ./bin/openboard-mcp ./cmd/mcp

  licensing:
    name: License and SBOM audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: bun install --cwd web --frozen-lockfile
      - run: bun run audit:licenses
      - run: bun run audit:vulnerabilities
      - run: bun run audit:deployment-env
      - run: bun run test:scripts
      - uses: actions/upload-artifact@v7
        with:
          name: openboard-sbom
          path: |
            docs/SBOM.spdx.json
            docs/LICENSE_REVIEW.json
          if-no-files-found: error
          retention-days: 14
      - run: bun run audit:cleanroom

  e2e:
    name: E2E (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - id: chromium
            project: chromium
            browser: chromium
            extended: true
          - id: firefox
            project: firefox
            browser: firefox
            extended: false
          - id: webkit
            project: webkit
            browser: webkit
            extended: false
          - id: mobile-chromium
            project: mobile-chromium
            browser: chromium
            extended: false
    env:
      OPENBOARD_DATABASE_URL: postgres://openboard_e2e:openboard_e2e@127.0.0.1:5432/openboard_e2e?sslmode=disable
      OPENBOARD_REDIS_URL: redis://127.0.0.1:6379/0
      OPENBOARD_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openboard_e2e
          POSTGRES_USER: openboard_e2e
          POSTGRES_PASSWORD: openboard_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openboard_e2e -d openboard_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install formal E2E database clients
        if: matrix.extended
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client redis-tools
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Film Chromium E2E (credential-free)
        if: matrix.extended
        run: bun run test:e2e --project=chromium e2e/film.spec.ts
      - run: bun run test:e2e --project=${{ matrix.project }}
      - if: matrix.extended
        run: bun run test:e2e:production --project=chromium --workers=1
      - if: matrix.extended
        run: bun run test:e2e:formal
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results-${{ matrix.id }}
          path: web/node_modules/.cache/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-result:
    name: Cross-browser and production E2E
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: e2e
    steps:
      - name: Require every E2E matrix job to pass
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
        run: test "$E2E_RESULT" = success

  container:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBOARD_TOKEN: ci-openboard-token-000000000000000000000000
      OPENBOARD_POSTGRES_PASSWORD: ci-postgres-password-00000000000000000000
      OPENBOARD_REDIS_PASSWORD: ci-redis-password-0000000000000000000000
      OPENBOARD_MASTER_KEY: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: openboard:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run formal local stack
        run: docker compose up --detach --no-build
      - name: Verify health, storage, media capability, and runtime user
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz > health.json; then
              break
            fi
            sleep 2
          done
          grep -q 'postgresql+redis' health.json
          docker compose exec -T openboard sh -c 'test "$(id -u)" -ne 0'
          docker compose exec -T openboard sh -c '
            test "$OPENBOARD_FFMPEG_PATH" = /usr/bin/ffmpeg
            test "$OPENBOARD_FFPROBE_PATH" = /usr/bin/ffprobe
            test "$(apk info -v ffmpeg)" = ffmpeg-8.0.1-r1
            "$OPENBOARD_FFMPEG_PATH" -hide_banner -version >/dev/null
            "$OPENBOARD_FFPROBE_PATH" -hide_banner -version >/dev/null
          '
          curl --fail --silent http://127.0.0.1:8080/api/film/capabilities > film-capabilities.json
          grep -q '"mp4Export":true' film-capabilities.json
          docker compose exec -T postgres psql -U openboard_local -d openboard_local -Atc \
            "select count(*) from information_schema.tables where table_schema='public'" | grep -Eq '^(1[2-9]|[2-9][0-9]+)$'
          docker compose exec -T redis redis-cli -a "$OPENBOARD_REDIS_PASSWORD" ping | grep -q PONG
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Clean up stack
        if: always()
        run: docker compose down --volumes --remove-orphans
