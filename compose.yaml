services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: openboard_local
      POSTGRES_USER: openboard_local
      POSTGRES_PASSWORD: "${OPENBOARD_POSTGRES_PASSWORD:?Set OPENBOARD_POSTGRES_PASSWORD in .env}"
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      # PostgreSQL 18 stores PGDATA below this parent mount. Keep this volume
      # name separate from the pre-18 openboard-postgres volume so an upgrade
      # cannot boot against an incompatible PG17 data directory by accident.
      - openboard-postgres18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openboard_local -d openboard_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${OPENBOARD_REDIS_PASSWORD:?Set OPENBOARD_REDIS_PASSWORD in .env}"]
    volumes:
      - openboard-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: "${OPENBOARD_REDIS_PASSWORD:?Set OPENBOARD_REDIS_PASSWORD in .env}"
    security_opt:
      - no-new-privileges:true

  openboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: openboard:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Personal deployments stay host-local unless explicitly exposed.
    ports:
      - "${OPENBOARD_BIND:-127.0.0.1}:${OPENBOARD_PORT:-8080}:8080"
    environment:
      OPENBOARD_ADDR: 127.0.0.1:8790
      OPENBOARD_DATA: /data
      OPENBOARD_ORIGINS: "${OPENBOARD_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}"
      # Require an explicit token even for local production-like deployments;
      # this prevents an accidental non-loopback bind from exposing the API.
      OPENBOARD_TOKEN: "${OPENBOARD_TOKEN:?Set OPENBOARD_TOKEN in .env}"
      OPENBOARD_AUTH_MODE: "${OPENBOARD_AUTH_MODE:-optional}"
      OPENBOARD_BOOTSTRAP_TOKEN: "${OPENBOARD_BOOTSTRAP_TOKEN:-}"
      OPENBOARD_PLATFORM_ADMIN_USER_IDS: "${OPENBOARD_PLATFORM_ADMIN_USER_IDS:-}"
      OPENBOARD_AGENT_ACCOUNT_EXECUTION: "${OPENBOARD_AGENT_ACCOUNT_EXECUTION:-false}"
      OPENBOARD_AGENT_WORKSPACE_ROOTS: "${OPENBOARD_AGENT_WORKSPACE_ROOTS:-}"
      OPENBOARD_CLAUDE_PERMISSION_MODE: "${OPENBOARD_CLAUDE_PERMISSION_MODE:-default}"
      OPENBOARD_PUBLIC_BASE_URL: "${OPENBOARD_PUBLIC_BASE_URL:-}"
      OPENBOARD_LINUXDO_CLIENT_ID: "${OPENBOARD_LINUXDO_CLIENT_ID:-}"
      OPENBOARD_LINUXDO_CLIENT_SECRET: "${OPENBOARD_LINUXDO_CLIENT_SECRET:-}"
      OPENBOARD_LINUXDO_REDIRECT_URL: "${OPENBOARD_LINUXDO_REDIRECT_URL:-}"
      OPENBOARD_DATABASE_URL: "postgres://openboard_local:${OPENBOARD_POSTGRES_PASSWORD}@postgres:5432/openboard_local?sslmode=disable"
      OPENBOARD_REDIS_URL: "redis://:${OPENBOARD_REDIS_PASSWORD}@redis:6379/0"
      OPENBOARD_MASTER_KEY: "${OPENBOARD_MASTER_KEY:?Set OPENBOARD_MASTER_KEY in .env}"
      OPENBOARD_BLOB_BACKEND: "${OPENBOARD_BLOB_BACKEND:-filesystem}"
      OPENBOARD_S3_ENDPOINT: "${OPENBOARD_S3_ENDPOINT:-}"
      OPENBOARD_S3_BUCKET: "${OPENBOARD_S3_BUCKET:-}"
      OPENBOARD_S3_REGION: "${OPENBOARD_S3_REGION:-auto}"
      OPENBOARD_S3_PREFIX: "${OPENBOARD_S3_PREFIX:-openboard}"
      OPENBOARD_S3_ACCESS_KEY_ID: "${OPENBOARD_S3_ACCESS_KEY_ID:-}"
      OPENBOARD_S3_SECRET_ACCESS_KEY: "${OPENBOARD_S3_SECRET_ACCESS_KEY:-}"
      OPENBOARD_S3_SESSION_TOKEN: "${OPENBOARD_S3_SESSION_TOKEN:-}"
      OPENBOARD_S3_ALLOW_INSECURE_LOOPBACK: "${OPENBOARD_S3_ALLOW_INSECURE_LOOPBACK:-false}"
      OPENBOARD_FILM_MODE: "${OPENBOARD_FILM_MODE:-true}"
      OPENBOARD_WEBDAV_MEDIA: "${OPENBOARD_WEBDAV_MEDIA:-false}"
      OPENBOARD_ADVANCED_VOICE: "${OPENBOARD_ADVANCED_VOICE:-false}"
      OPENBOARD_LOCAL_WORKFLOWS: "${OPENBOARD_LOCAL_WORKFLOWS:-false}"
      OPENBOARD_COMFYUI_EXECUTORS: "${OPENBOARD_COMFYUI_EXECUTORS:-}"
      OPENBOARD_STYLE_EXTRACTION: "${OPENBOARD_STYLE_EXTRACTION:-false}"
      OPENBOARD_FILM_STAGE_WAIVER: "${OPENBOARD_FILM_STAGE_WAIVER:-false}"
      # The image owns these exact package paths. Empty/invalid host overrides
      # are ignored here so Compose cannot accidentally hide image capability.
      OPENBOARD_FFMPEG_PATH: /usr/bin/ffmpeg
      OPENBOARD_FFPROBE_PATH: /usr/bin/ffprobe
      OPENBOARD_PDFTOTEXT_PATH: /usr/bin/pdftotext
      OPENBOARD_PDF_SANDBOX_PATH: /usr/local/bin/openboard-pdf-sandbox
      OPENBOARD_PDFTOTEXT_TIMEOUT: "${OPENBOARD_PDFTOTEXT_TIMEOUT:-30s}"
      OPENBOARD_PDFTOTEXT_MAX_OUTPUT_BYTES: "${OPENBOARD_PDFTOTEXT_MAX_OUTPUT_BYTES:-1048576}"
      OPENBOARD_FILM_IMPORT_MAX_BYTES: "${OPENBOARD_FILM_IMPORT_MAX_BYTES:-52428800}"
      OPENBOARD_FILM_RENDER_TIMEOUT_SECONDS: "${OPENBOARD_FILM_RENDER_TIMEOUT_SECONDS:-900}"
      OPENBOARD_DEBUG: "${OPENBOARD_DEBUG:-false}"
      # Direct provider traffic remains the default; opt in explicitly.
      OPENBOARD_PROVIDER_PROXY_URL: "${OPENBOARD_PROVIDER_PROXY_URL:-}"
    volumes:
      - openboard-data:/data
    read_only: true
    mem_limit: 2g
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m,mode=1777,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  openboard-data:
  openboard-postgres18:
  openboard-redis:
